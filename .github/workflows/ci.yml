name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: every job only checks out and inspects the tree.
permissions:
  contents: read

jobs:
  test:
    strategy:
      # Report every OS; one failing must not cancel the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # jq and git ship with both runner images; tmux is the one addition.
      - name: Install tmux
        run: if command -v apt-get >/dev/null; then sudo apt-get install -y tmux; else brew install tmux; fi
      - name: Contract test
        run: tests/contract.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=warning agent-sessions install.sh tests/contract.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Adapter manifests parse
        run: for f in adapters/*/.claude-plugin/*.json adapters/*/hooks/*.json adapters/*/hooks.json; do jq empty "$f"; done
